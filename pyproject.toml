[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "db-agent"
version = "0.1.0"
description = "Terminal database CLI assistant with selectable BYO API-key providers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "pymysql>=1.1.0",
    "psycopg2-binary>=2.9.0",
    "langfuse>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
web = [
    "streamlit>=1.30.0",
]

[project.scripts]
db-agent = "db_agent.cli:main"

[tool.setuptools.packages.find]
include = ["db_agent*"]
