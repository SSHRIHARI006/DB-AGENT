services:
  db-agent:
    build: .
    container_name: db-agent-web
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - db_agent_data:/app/.db_agent
    # No host ports published: the container joins the shared web_network and
    # is reached by Caddy (production_proxy) over Docker DNS as db-agent:8501.
    networks:
      - web_network
    healthcheck:
      # python:3.12-slim ships no curl/wget, so probe with urllib.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  db_agent_data:

networks:
  web_network:
    external: true
